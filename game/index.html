<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teluk Senja — Make GTA 6</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10141c; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #eef1f5; }
  #minimap { position: absolute; top: 16px; left: 16px; width: 190px; height: 190px; border: 2px solid rgba(255,255,255,0.35); border-radius: 8px; background: #10141c; }
  #stars { position: absolute; top: 16px; right: 20px; font-size: 30px; letter-spacing: 4px; color: #ffd94d; text-shadow: 0 2px 6px rgba(0,0,0,0.7); display: none; }
  #speed { position: absolute; bottom: 20px; right: 24px; font-size: 26px; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,0.7); display: none; }
  #prompt { position: absolute; bottom: 84px; left: 50%; transform: translateX(-50%); font-size: 19px; background: rgba(0,0,0,0.55); padding: 10px 18px; border-radius: 8px; display: none; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10, 12, 24, 0.55); text-align: center; }
  .overlay h1 { font-size: 64px; margin: 0 0 8px; color: #ffb347; text-shadow: 0 4px 24px rgba(0,0,0,0.8); }
  .overlay p { font-size: 20px; margin: 6px 0; color: #eef1f5; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
  .overlay .hint { font-size: 16px; color: #c9cfdb; }
  #paused { display: none; }
  #paused h1 { font-size: 48px; color: #eef1f5; }
  #selftest { position: absolute; top: 16px; left: 220px; max-width: 560px; max-height: 90vh; overflow: auto; background: rgba(0,0,0,0.8); color: #d8ffd8; font: 13px/1.5 monospace; white-space: pre-wrap; padding: 12px; border-radius: 8px; display: none; }
</style>
</head>
<body>
<canvas id="game" aria-label="Teluk Senja: game open-world di kota pesisir Indonesia saat senja"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="hud">
  <canvas id="minimap" width="190" height="190"></canvas>
  <div id="stars"></div>
  <div id="speed"></div>
  <div id="prompt"></div>
  <div id="title" class="overlay">
    <h1>Teluk Senja</h1>
    <p>Kota pesisir Indonesia saat senja. Jalan kaki, curi mobil, kabur dari polisi.</p>
    <p class="hint">WASD bergerak &middot; Mouse melihat &middot; Shift lari &middot; E masuk / keluar mobil &middot; Spasi rem &middot; P jeda</p>
    <p class="hint">Klik atau tekan Enter untuk bermain</p>
  </div>
  <div id="paused" class="overlay">
    <h1>Jeda</h1>
    <p>Tekan P untuk lanjut bermain</p>
  </div>
  <div id="selftest"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
